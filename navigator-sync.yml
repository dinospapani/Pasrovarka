name: BiteCast Navigator sync
# Μηνιαία ενημέρωση του navigator-mpa.json από το ProtectedSeas Navigator API (ανοιχτό, χωρίς κλειδί).
# Αν κάτι δεν πάει καλά (σφάλμα δικτύου, ύποπτη απάντηση, πολλές διαγραφές), το script σταματά και το αρχείο δεν αλλάζει.
on:
  schedule:
    - cron: '17 4 3 * *'
  workflow_dispatch:
concurrency:
  group: navigator-sync
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node navigator-sync.mjs
      - name: Commit αν άλλαξε
        run: |
          if git diff --quiet -- navigator-mpa.json; then echo "Καμία αλλαγή"; exit 0; fi
          git config user.name "bitecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add navigator-mpa.json
          git commit -m "Navigator: ενημέρωση περιοχών"
          git push
