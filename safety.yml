name: BiteCast safety
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
concurrency:
  group: safety
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install nodemailer@6 web-push@3.6.7 --no-save
      - run: node safety-job.mjs
        env:
          SUPABASE_URL: https://sgfohmqwdwtkhtrebnix.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          VAPID_PUBLIC: BIjAK4nbFMRkUEPqIqCcsbFDDx7pkygkJ_XxCy-guhrJ0t2tX3NgkeeRvPcC_MRwAvtdiV3No0KXKqLhCwI9IwM
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
