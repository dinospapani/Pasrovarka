<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06171F">
<title>BiteCast</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0;height:100%;background:#06171F;color:#E6F1F2;font:16px system-ui,sans-serif}body{display:grid;place-items:center}a{color:#FF7A4D}</style>
<script>
/* BiteCast: η κύρια εφαρμογή είναι πλέον στο v4/. Η κλασική έκδοση μένει στο classic.html ως εφεδρεία.
   Οι συντομεύσεις (?a=bite|trip|fc) περνούν στη νέα εφαρμογή. Ο service worker της ρίζας μένει για τις ειδοποιήσεις. */
(function(){
  var a=''; try{ a=new URLSearchParams(location.search).get('a')||''; }catch(e){}
  var M={bite:'#new',trip:'#trip',fc:'#forecast',log:'#log',map:'#map',prof:'#profile'};
  if(a&&!M[a]){ location.replace('classic.html'+location.search); return; }
  /* σύνδεσμοι από email (επιβεβαίωση, νέος κωδικός) και ιστορικό ειδοποιήσεων: τα χειρίζεται η κλασική */
  if(/access_token|type=recovery|error_description/.test(location.hash)){ location.replace('classic.html'+location.search+location.hash); return; }
  if(/^#inbox/.test(location.hash)){ location.replace('v4/#alerts'); return; }
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
  location.replace('v4/'+(M[a]||location.hash||''));
})();
</script>
</head>
<body><p>BiteCast… <a href="v4/">Άνοιγμα</a> · <a href="classic.html">Κλασική έκδοση</a></p></body>
</html>
