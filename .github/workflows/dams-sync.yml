name: Dams fullness sync (WDD)

on:
  workflow_dispatch:
  push:
    paths:
      - "dams_xlsx/**"
  schedule:
    - cron: "23 7,15 * * *"

permissions:
  contents: write

concurrency:
  group: dams-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install openpyxl

      - name: Build dams_levels.json
        run: |
          ok=0
          python3 dams_build.py && ok=1
          for f in dams_xlsx/*.xlsx; do [ -f "$f" ] && python3 dams_build.py "$f" && ok=1; done
          [ $ok = 1 ]

      - name: Commit if changed
        run: |
          git config user.name "bitecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dams_levels.json
          git diff --cached --quiet || git commit -m "Dams fullness update"
          git push
