name: Coastline sync (OSM)

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 2 */3 *"   # every 3 months, 2nd day, 03:17 UTC

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install shapely pyshp pillow numpy

      - name: Download OSM land polygons (WGS84, split)
        run: |
          curl -fL --retry 3 -o land.zip https://osmdata.openstreetmap.de/download/land-polygons-split-4326.zip
          unzip -q -j land.zip -d land
          ls -la land

      - name: Build coastgrid.js, coast_cy, coast_gr
        run: python3 coastline_build.py land/land_polygons.shp .

      - name: Commit if changed
        run: |
          rm -rf land land.zip
          git config user.name "bitecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add coastgrid.js coast_cy.geojson coast_gr.geojson
          git diff --cached --quiet || git commit -m "Coastline update from OpenStreetMap"
          git push
